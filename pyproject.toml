[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.0.0"
requires-python = ">=3.12"

dependencies = [
    "numpy==2.4.4",
    "keyring==25.6.0",
    "pydantic==2.12.5",
    "pyqtdarktheme==2.1.0",
    "winotify==1.1.0",
    "keyboard==0.13.5",
    "wmi==1.5.1",
    "pyad==0.6.0",
    "PyAutoGUI==0.9.54",
    # src/core/agent_api: Ed25519 request signing and HTTP transport
    "cryptography==46.0.7",
    "requests==2.33.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[tool.uv.workspace]
members = [
    "tools",
    "src/pkgman",
    "src/utils",
    "src/mvc",
    "src/service_gateway",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/app/view/widgets"]  # generated by pyside6-uic

[tool.ruff.lint.per-file-ignores]
# Command-line sub-commands are dispatched before Qt is imported.
"src/main.py" = ["E402"]
