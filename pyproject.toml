[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.0.0"
requires-python = ">=3.12"

dependencies = [
    "numpy==2.4.4",
    "keyring==25.6.0",
    "pydantic==2.12.5",
    "pyqtdarktheme==2.1.0",
    "winotify==1.1.0",
    "keyboard==0.13.5",
    "wmi==1.5.1",
    "pyad==0.6.0",
    "PyAutoGUI==0.9.54"
]

[tool.uv.workspace]
members = [
    "tools",
    "src/pkgman",
    "src/utils",
    "src/mvc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
