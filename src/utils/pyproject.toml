[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utils"
version = "0.0.0"
dependencies = [
    "Cerberus==1.3.8",
    "PySide6==6.11.0",
    "PyYAML==6.0.3",
    "asammdf==8.8.1",
    "dirsync==2.2.6",
    "openpyxl==3.1.5",
    "psutil==7.0.0",
    "psycopg2==2.9.11",
    "requests==2.33.1",
    "tzlocal==5.3.1",
    "urllib3==2.6.3",
    "pywin32==311",
    "packaging",
]

[tool.setuptools]
packages = ["utils"]

[tool.setuptools.package-dir]
utils = "."
